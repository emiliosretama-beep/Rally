<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1015">
<title>Born to Climb</title>
<link rel="stylesheet" href="src/fonts.css">
<style>
/* Dirección visual: equipo de expedición. Tipografía condensada, paneles sólidos con esquinas
   cortadas (etiquetas de equipo), naranja de seguridad, amarillo de cuerda, iconos de trazo. */
:root{--ink:#f3eee6;--dim:#aab3c0;--mute:#6f7987;--bg:#0b0e13;--panel:#11151c;--panel2:#171c25;--panel3:#1e2430;
--line:rgba(243,238,230,.11);--line2:rgba(243,238,230,.22);--or:#ff5a1f;--or2:#ff7a42;--orD:#c23d0c;--rope:#f2c230;--ice:#8fd0f2;--red:#e5484d;--ok:#4fd18b;
--sta:#7ee06a;--cold:#8fd3ff;--injury:#e5484d;
--fd:'Barlow Condensed','DIN Condensed','Avenir Next Condensed','Bahnschrift','Arial Narrow',sans-serif;
--fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--cut:12px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--fb);font-weight:500;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
/* esquinas cortadas: arriba-izquierda y abajo-derecha */
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}

/* ---- pantallas ---- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));z-index:20}
.screen.dim{background:linear-gradient(180deg,rgba(8,10,14,.55),rgba(8,10,14,.86))}
body.inmenu .screen.dim{background:#0b0e13}
body.live.inmenu .screen.dim{background:linear-gradient(90deg,rgba(8,10,14,.9),rgba(8,10,14,.72))}
/* panel de las pantallas secundarias: sólido, filete de 1 px, esquinas cortadas */
.card{position:relative;width:min(500px,100%);max-height:100%;overflow:auto;padding:20px 22px 18px;background:var(--panel);
box-shadow:inset 0 0 0 1px var(--line2),0 24px 70px rgba(0,0,0,.45);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);scrollbar-width:thin}
.card::before{content:'';position:absolute;left:0;top:0;width:56px;height:3px;background:var(--or)}
h2{margin:2px 0 14px;font-family:var(--fd);font-weight:800;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
h2::after{content:'';flex:1;height:1px;background:var(--line2)}
.h3{font-size:20px;margin:18px 0 10px}
.small{font-size:13px;color:var(--dim);margin:4px 0 8px;min-height:1.2em;line-height:1.35}

/* botones */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin:8px 0;padding:0 18px;border:0;border-radius:0;
font-family:var(--fd);font-weight:800;font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:#160a03;background:var(--or);cursor:pointer;
clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);transition:background .12s,transform .06s}
.btn:hover{background:var(--or2)}
.btn:active{transform:translateY(1px);background:var(--orD);color:#fff}
.btn svg.i{width:22px;height:22px;stroke-width:2.4}
.btn.cta{justify-content:space-between;min-height:60px;font-size:25px;padding:0 20px 0 22px}
.btn.cta svg.i{width:26px;height:26px;transition:transform .15s}
.btn.cta:hover svg.i{transform:translateX(4px)}
.btn.sec{color:var(--ink);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);font-size:19px;min-height:48px;justify-content:flex-start}
.btn.sec svg.i{color:var(--or)}
.btn.sec:hover{background:var(--panel3);box-shadow:inset 0 0 0 1px var(--or)}
.btn.sec:active{background:#0e1218;color:var(--ink)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--rope)}
.btn.sec:focus-visible{box-shadow:inset 0 0 0 2px var(--rope)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.tiles .btn.tile{flex-direction:column;justify-content:center;gap:3px;min-height:64px;font-size:15px;letter-spacing:.08em;padding:6px 4px;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.tiles .btn.tile svg.i{width:22px;height:22px}
.back{margin-top:14px}

/* control segmentado: cuadrado, con filete */
.seg{display:flex;padding:3px;gap:3px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line2);margin:6px 0 4px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;cursor:pointer;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink);background:var(--panel2)}
.seg button.sel{background:var(--or);color:#160a03}
.seg button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--rope)}
/* opciones */
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.opt:last-of-type{border-bottom:0}
.opt .seg{margin:0;min-width:52%}
input[type=range]{-webkit-appearance:none;appearance:none;width:52%;height:30px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--line2),var(--line2))}
input[type=range]::-moz-range-track{height:4px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;margin-top:-10px;background:var(--or);border:0;box-shadow:0 0 0 3px var(--bg)}
input[type=range]::-moz-range-thumb{width:14px;height:24px;border:0;border-radius:0;background:var(--or)}
input[type=range]:focus-visible{outline:2px solid var(--rope);outline-offset:2px}
/* ayuda */
.howto p{margin:9px 0;line-height:1.45;font-size:15px;color:#dfe5ee;padding-left:14px;border-left:2px solid var(--line2)}
.howto p b{color:var(--ink);font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.keys{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.6;padding:10px 12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
/* récords, tramos e insignias */
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.rec span{display:flex;align-items:center;gap:8px}
.rec b{font-family:var(--fd);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.recH{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding:6px 10px;background:var(--panel2);font-family:var(--fd);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--or)}
.recH svg.i{width:22px;height:22px}
.mdl{display:inline-flex;width:22px;height:22px;flex:none}
.mdl svg{width:100%;height:100%}
.mdl.gold{color:#f2c230}.mdl.silver{color:#c9d2dc}.mdl.bronze{color:#d0874d}
.tramo{justify-content:space-between!important;gap:12px;text-align:left;min-height:58px;padding:0 14px;text-transform:none;letter-spacing:0}
.tramo .tn{font-style:normal;font-family:var(--fd);font-weight:800;font-size:26px;color:var(--or);min-width:34px;font-variant-numeric:tabular-nums}
.tramo span{flex:1;display:flex;flex-direction:column;font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.tramo small{font-family:var(--fb);font-weight:500;font-size:12.5px;color:var(--dim);letter-spacing:0;text-transform:none;margin-top:1px}
.tramo b{display:flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tramo.locked{opacity:.45}.tramo.locked .tn{color:var(--mute)}
#badgeList{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bd{display:flex;gap:9px;align-items:center;padding:8px 10px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:700;line-height:1.2}
.bd i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;color:#160a03;background:var(--rope);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.bd i svg.i{width:18px;height:18px;stroke-width:2.2}
.bd.off{opacity:.4}.bd.off i{background:var(--panel3);color:var(--mute)}
/* resultados */
.stats{display:grid;grid-template-columns:1fr auto;gap:0;margin:10px 0 12px}
.stats span{padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.splits{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.splits span{display:flex;gap:6px;align-items:baseline;padding:4px 8px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--fd);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.splits span i{font-style:normal;color:var(--or)}
.stats b{padding:8px 0;border-bottom:1px solid var(--line);text-align:right;font-family:var(--fd);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.medal{display:flex;justify-content:center;margin:6px 0 2px}
.medal .mdl{width:76px;height:76px}
#winTitle{font-size:44px}
.loadbar{height:4px;background:var(--line2);overflow:hidden;margin-top:14px}
.loadbar i{display:block;height:100%;width:30%;background:var(--or);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.ver{position:absolute;right:14px;bottom:10px;font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--mute)}
.lang{position:absolute;top:calc(14px + var(--sat));right:calc(16px + var(--sar));z-index:3}
.lang button{display:flex;align-items:center;gap:6px;background:rgba(11,14,19,.72);color:var(--ink);border:0;box-shadow:inset 0 0 0 1px var(--line2);padding:8px 12px;
font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:.1em;cursor:pointer}
.lang button:hover{box-shadow:inset 0 0 0 1px var(--or)}
.lang svg.i{width:18px;height:18px}

/* ---- portada: panel lateral sobre el vuelo 3D ---- */
#menu{justify-content:flex-start;padding:0;background:linear-gradient(180deg,#2b3550 0%,#141a28 100%);overflow:hidden}
#menu .mtn{position:absolute;left:0;bottom:0;width:100%;height:62%;pointer-events:none}
body.live #menu{background:transparent}
body.live #menu .mtn{display:none}
#menu .scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(9,11,15,.94) 0,rgba(9,11,15,.86) min(470px,52vw),rgba(9,11,15,0) min(760px,80vw))}
#menu .topo{position:absolute;left:0;top:0;width:min(520px,56vw);height:100%;pointer-events:none;opacity:.5}
.menuCard{position:relative;z-index:2;width:min(440px,100%);height:100%;overflow:auto;padding:calc(30px + var(--sat)) 26px calc(22px + var(--sab)) calc(34px + var(--sal));
display:flex;flex-direction:column;justify-content:flex-start;scrollbar-width:none}
.menuCard::-webkit-scrollbar{display:none}
.menuCard>*{flex:none}
/* centrado que no corta arriba si no cabe (se puede desplazar) */
.menuCard>:first-child{margin-top:auto}.menuCard>:last-child{margin-bottom:auto}
.kick{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
.kick::before{content:'';width:22px;height:2px;background:var(--or)}
.title{margin:8px 0 4px;font-family:var(--fd);font-weight:800;text-transform:uppercase;line-height:.84;letter-spacing:-.005em}
.title small{display:block;font-size:30px;letter-spacing:.14em;color:var(--dim)}
.title span{display:block;font-size:clamp(64px,10vw,96px);color:var(--ink)}
.title span em{font-style:normal;color:var(--or)}
.ridge{display:block;width:100%;height:22px;margin:2px 0 6px;color:var(--or)}
.sub{margin:0 0 18px;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--rope)}
.lbl{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin:8px 0 6px}
/* selector de montaña: dos fichas técnicas */
.mtnSel{display:flex;gap:8px;margin:0 0 6px}
.mtnSel button{position:relative;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);
color:var(--dim);font:inherit;padding:10px 12px 10px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);transition:background .12s,box-shadow .12s}
.mtnSel button:hover{background:var(--panel3)}
.mtnSel button svg.mi{width:44px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;color:var(--mute);margin-bottom:2px}
.mtnSel button b{font-family:var(--fd);font-weight:800;font-size:21px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);line-height:1}
.mtnSel button small{font-size:12px;line-height:1.25;color:var(--dim)}
.mtnSel button em{font-style:normal;white-space:nowrap;font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.mtnSel button.sel{background:#22180f;box-shadow:inset 0 0 0 2px var(--or)}
.mtnSel button.sel svg.mi,.mtnSel button.sel em{color:var(--or)}
.mtnSel button.sel::after{content:'';position:absolute;right:0;top:0;border-style:solid;border-width:0 18px 18px 0;border-color:transparent var(--or) transparent transparent}
.mtnSel button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--rope)}
#modeDesc{margin:6px 0 4px}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--fd)}
.txt{text-shadow:0 1px 2px rgba(0,0,0,.65),0 0 10px rgba(0,0,0,.3)}
#alt{position:absolute;top:calc(10px + var(--sat));left:calc(16px + var(--sal));line-height:1;font-weight:800}
#alt b{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#alt u{text-decoration:none;font-size:20px;margin-left:3px;color:var(--dim)}
#alt small{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--rope);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
#alt small::before{content:'';width:14px;height:2px;background:var(--or)}
#prog{position:absolute;left:calc(19px + var(--sal));top:calc(80px + var(--sat));width:4px;height:min(36vh,220px);background:rgba(11,14,19,.55);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
#prog .fill{position:absolute;bottom:0;left:0;right:0;background:var(--or)}
#prog .me{position:absolute;left:-6px;width:16px;height:16px;margin-bottom:-8px;background:var(--ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 0 2px var(--bg)}
#prog .fire{position:absolute;left:10px;width:14px;height:14px;margin-bottom:-7px;color:var(--dim);display:flex}
#prog .fire.lit{color:var(--rope)}#prog .fire.top{color:var(--or)}
#prog .fire svg.i{width:14px;height:14px;stroke-width:2.4;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
#prog .fire.dot::before{content:'';width:4px;height:4px;margin:5px;background:var(--dim)}
#topR{position:absolute;top:calc(10px + var(--sat));right:calc(12px + var(--sar));display:flex;gap:10px;align-items:center;pointer-events:auto}
#timer{display:flex;align-items:center;gap:6px;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
#timer svg.i{width:18px;height:18px;color:var(--rope)}
#bPause{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border:0;background:rgba(11,14,19,.62);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);cursor:pointer;
clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
#bPause svg.i{width:20px;height:20px;stroke-width:3}
#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:min(560px,48vw);display:flex;flex-direction:column;align-items:center;gap:8px}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(11,14,19,.7);box-shadow:inset 0 0 0 1px var(--line2);padding:5px 10px 5px 8px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg.i{width:16px;height:16px;stroke-width:2.4}
.chip.on{box-shadow:inset 3px 0 0 var(--ok),inset 0 0 0 1px var(--line2)}.chip.on svg.i{color:var(--ok)}
.chip.off{box-shadow:inset 3px 0 0 var(--rope),inset 0 0 0 1px var(--line2);color:#ffe9b0}.chip.off svg.i{color:var(--rope)}
.chip.hard{box-shadow:inset 3px 0 0 var(--red),inset 0 0 0 1px var(--line2)}.chip.hard svg.i{color:var(--red)}
.chip.rest{box-shadow:inset 3px 0 0 var(--ice),inset 0 0 0 1px var(--line2);color:#dff3ff}.chip.rest svg.i{color:var(--ice)}
.chip.storm{box-shadow:inset 3px 0 0 #dff3ff,inset 0 0 0 1px var(--line2);color:#eaf7ff}
.chip.stat svg.i{color:var(--dim)}
#chLbl{position:absolute;top:calc(74px + var(--sat));left:calc(36px + var(--sal));font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#ffe4bd;max-width:40vw}
/* anillo de resistencia junto al escalador */
#ring{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;opacity:0;transition:opacity .25s;will-change:transform}
#ring.show{opacity:1}
#ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#ring .bg{fill:rgba(11,14,19,.35);stroke:rgba(0,0,0,.5);stroke-width:6}
#ring .fg{fill:none;stroke:var(--sta);stroke-width:6;stroke-linecap:butt;stroke-dasharray:113.1;transition:stroke-dashoffset .12s,stroke .2s}
#ring.mid .fg{stroke:var(--rope)}#ring.low .fg{stroke:#ff5a4a}#ring.rest .fg{stroke:var(--ice)}
#ring.low svg{animation:blink .35s infinite alternate}
@keyframes blink{to{filter:brightness(1.7) drop-shadow(0 0 6px rgba(255,80,60,.9))}}
#drop{position:absolute;top:calc(98px + var(--sat));left:calc(36px + var(--sal));display:flex;align-items:center;gap:5px;font-weight:800;font-size:20px;color:#ffe4bd;font-variant-numeric:tabular-nums}
#drop svg.i{width:16px;height:16px;stroke-width:2.6}
#drop small{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
#drop.hi{color:#ff9a7a}
#title{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .8s,letter-spacing 1.2s;letter-spacing:.01em;width:min(92vw,760px)}
#title.in{opacity:1;letter-spacing:.04em}#title.out{opacity:0}
#title small{display:inline-flex;align-items:center;gap:12px;font-size:15px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--rope)}
#title small::before,#title small::after{content:'';width:36px;height:2px;background:var(--or)}
#title b{display:block;font-size:clamp(40px,8vw,76px);font-weight:800;line-height:.95;margin:6px 0 4px;text-transform:uppercase;text-shadow:0 3px 22px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.8)}
#title span{display:block;font-family:var(--fb);font-size:16px;font-weight:600;color:#e9eef7;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#danger{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;background:radial-gradient(ellipse at center,transparent 48%,rgba(8,6,14,.85) 100%)}
/* frío y ventisca (montaña nevada) */
#coldBar{position:absolute;top:calc(124px + var(--sat));left:calc(36px + var(--sal));display:flex;align-items:center;gap:6px;color:var(--ice)}
#coldBar svg.i{width:18px;height:18px}
#coldBar div{width:96px;height:6px;background:rgba(11,14,19,.6);box-shadow:0 0 0 1px var(--line2);overflow:hidden}
#coldBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#bfe6ff,#5fb3ff)}
#coldBar.hi i{background:linear-gradient(90deg,#8fd3ff,#3b7dff);animation:blink .6s infinite alternate}
#frost{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at center,transparent 52%,rgba(210,235,255,.55) 82%,rgba(240,250,255,.85) 100%)}
#prompt{position:absolute;left:50%;bottom:calc(104px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(11,14,19,.78);box-shadow:inset 0 0 0 1px var(--line2);
padding:8px 14px;font-weight:800;font-size:18px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
#prompt kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;background:var(--ink);color:var(--bg);padding:0 7px;font-family:var(--fd);font-weight:800;font-size:16px;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
/* brújula: cinta de rumbo con marcas */
#compass{position:absolute;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);width:min(320px,46vw);height:34px;background:rgba(11,14,19,.5);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;
background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 16px);background-size:100% 6px;background-repeat:repeat-x;background-position:0 100%}
#compass .tick{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-6px;border-style:solid;border-width:7px 6px 0 6px;border-color:var(--or) transparent transparent transparent}
#compass .cm{position:absolute;top:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1;white-space:nowrap;color:var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
#compass .cm svg.i{width:15px;height:15px;stroke-width:2.4}
#compass #cmFire{color:var(--rope)}#compass #cmFlag{color:var(--or)}#compass #cmGhost{color:var(--ice)}
#compass .cm small{display:block;font-size:11px;font-weight:800;color:#fff;margin-top:1px;letter-spacing:.04em}
#compass .cm.edge{opacity:.5}
#cine{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 62%,rgba(10,8,20,.32) 100%)}
#toast{position:absolute;top:calc(64px + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;text-align:center;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;max-width:84vw;transition:opacity .3s}
#toast svg.i{width:22px;height:22px;color:var(--rope);flex:none}
#hint{position:absolute;top:calc(100px + var(--sat));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-start;background:rgba(11,14,19,.86);box-shadow:inset 3px 0 0 var(--or),inset 0 0 0 1px var(--line2);
padding:11px 16px 11px 14px;font-family:var(--fb);font-weight:600;font-size:15px;line-height:1.4;max-width:min(540px,84vw);text-align:left;transition:opacity .4s}
#hint svg.i{width:18px;height:18px;color:var(--or);margin-top:1px;flex:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .25s}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:15;opacity:0;transition:opacity .6s}
/* ---- controles táctiles: anillos finos con iconos ---- */
#touch{position:fixed;inset:0;pointer-events:none;z-index:11;font-family:var(--fd)}
#joyBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(243,238,230,.4);background:radial-gradient(circle,rgba(11,14,19,.1) 40%,rgba(11,14,19,.35))}
#joyBase::before{content:'';position:absolute;inset:12px;border-radius:50%;border:1px dashed rgba(243,238,230,.22)}
#joyKnob{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(243,238,230,.85);box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 0 0 4px rgba(11,14,19,.15)}
#joyHint{position:absolute;left:calc(40px + var(--sal));bottom:calc(60px + var(--sab));width:112px;height:112px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(243,238,230,.18)}
#joyHint::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(243,238,230,.3)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(11,14,19,.5);box-shadow:inset 0 0 0 2px rgba(243,238,230,.5),0 2px 10px rgba(0,0,0,.25);color:var(--ink);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:transform .06s,background .1s}
.tbtn svg.i{width:26px;height:26px;stroke-width:2.2}
.tbtn.on{background:rgba(255,90,31,.82);box-shadow:inset 0 0 0 2px var(--or2);transform:scale(.94);color:#fff}
#tGrab{width:92px;height:92px;right:calc(18px + var(--sar));bottom:calc(26px + var(--sab));box-shadow:inset 0 0 0 3px var(--or),0 2px 10px rgba(0,0,0,.25)}
#tGrab svg.i{width:32px;height:32px}
#tJump{width:78px;height:78px;right:calc(122px + var(--sar));bottom:calc(18px + var(--sab))}
#tSprint{width:60px;height:60px;right:calc(130px + var(--sar));bottom:calc(110px + var(--sab))}
#tSprint svg.i{width:22px;height:22px}#tSprint span{font-size:10px}
#tUse{width:66px;height:66px;right:calc(30px + var(--sar));bottom:calc(132px + var(--sab));box-shadow:inset 0 0 0 2px var(--rope),0 2px 10px rgba(0,0,0,.25);color:var(--rope)}
#tGrab.latched{background:rgba(79,209,139,.55)}
#tSprint.latched{background:rgba(242,194,48,.55);color:#160a03}

/* pantallas bajas (teléfono acostado) */
@media (max-height:430px){
.menuCard{padding-top:calc(10px + var(--sat));padding-bottom:calc(8px + var(--sab));width:min(400px,100%)}
.kick{font-size:11px}.title{margin:3px 0 0}.title small{font-size:16px}.title span{font-size:44px}.ridge{height:10px;margin:0 0 6px}.sub{display:none}
#modeDesc{font-size:12px;margin:2px 0 0;min-height:0}.seg button{padding:6px}
.lbl{display:none}.mtnSel button{flex-direction:row;align-items:center;gap:8px;padding:6px 10px}.mtnSel button small,.mtnSel button em{display:none}.mtnSel button svg.mi{width:32px;height:20px;margin:0}
.mtnSel button b{font-size:18px}
.btn{min-height:42px;margin:5px 0;font-size:18px}.btn.cta{min-height:46px;font-size:21px}.btn.sec{min-height:40px;font-size:17px}
.tiles .btn.tile{min-height:42px;flex-direction:row;font-size:14px;gap:6px;letter-spacing:.03em;white-space:nowrap}
.card{padding:12px 18px 12px}h2{font-size:24px;margin-bottom:8px}.opt{padding:5px 0}.howto p{margin:5px 0;font-size:13.5px}.small{margin:2px 0 4px}
.stats{margin:4px 0 8px;grid-template-columns:auto 1fr auto 1fr;column-gap:12px}.stats span,.stats b{padding:4px 0}.medal{margin:0}.medal .mdl{width:40px;height:40px}#winTitle{font-size:30px}.splits{margin-bottom:6px}
#bottom{width:min(440px,42vw)}#prompt{bottom:calc(122px + var(--sab))}#prog{height:30vh}.ver{bottom:4px}
#alt b{font-size:34px}#title{top:58%}#title b{font-size:clamp(32px,6.5vw,50px)}}
/* vertical: la portada es una hoja abajo */
@media (orientation:portrait){
#menu{align-items:flex-end}
#menu .scrim{background:linear-gradient(0deg,rgba(9,11,15,.96) 0,rgba(9,11,15,.88) 62%,rgba(9,11,15,0) 92%)}
#menu .topo{width:100%;height:70%;top:auto;bottom:0}
.menuCard{width:100%;height:auto;max-height:100%;justify-content:flex-end;padding:calc(20px + var(--sat)) calc(20px + var(--sar)) calc(18px + var(--sab)) calc(20px + var(--sal))}
.title span{font-size:clamp(60px,18vw,84px)}
#bottom{width:min(520px,88vw);bottom:calc(208px + var(--sab))}#prompt{bottom:calc(290px + var(--sab))}#compass{top:calc(66px + var(--sat));width:min(300px,70vw)}
#chLbl{top:calc(108px + var(--sat));max-width:70vw}#drop{top:calc(130px + var(--sat))}#coldBar{top:calc(154px + var(--sat))}#toast{top:calc(160px + var(--sat))}#hint{top:calc(196px + var(--sat))}#title{top:44%}}
/* panel de ajuste */
#tune{position:fixed;left:calc(10px + var(--sal));top:calc(60px + var(--sat));z-index:30;background:rgba(11,14,19,.92);box-shadow:inset 0 0 0 1px var(--line2);padding:8px 10px;width:250px;max-height:70vh;overflow:auto;font-size:12px}
#tune label{display:block;margin:4px 0}#tune input{width:100%}
</style>
</head>
