<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>FRENTE 44</title>
<meta name="description" content="FRENTE 44: disparos en primera persona en la Segunda Guerra Mundial. Campaña de Normandía a Las Ardenas con escuadra, armas de la época, táctil, mando y teclado.">
<meta name="theme-color" content="#14160f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%234a5228'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23e8e1cc' stroke-width='4'/%3E%3Cpath d='M32 13l5.4 16.6H55L40.8 39.9l5.4 16.6L32 46.2 17.8 56.5l5.4-16.6L9 29.6h17.6z' fill='%23e8e1cc'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira+Stencil+One&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* ---------- Base: paleta militar (oliva, caqui, papel) ---------- */
:root{
  --bg:#14160f;--ink:#ece6d3;--muted:#a9a58f;--line:#3a3d2c;
  --olive:#4a5228;--olive2:#5f6b33;--khaki:#c2b280;--paper:#e8e1cc;--paperInk:#24231b;
  --red:#b3261e;--brass:#c9a03a;--good:#8fbf5a;--glass:rgba(16,18,12,.78);
  --cond:"Saira Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --stencil:"Saira Stencil One","Saira Condensed","Arial Narrow",Impact,sans-serif;
  --type:"Special Elite","Courier New",Courier,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --ts:1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--cond);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--stencil);font-weight:400;letter-spacing:.04em;text-transform:uppercase;margin:0}
/* ---------- Capas ---------- */
#c{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none;outline:none}
#hud,#touch,#menu,#fade{position:fixed;inset:0;pointer-events:none}
#hud{z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.65)}
#touch{z-index:2;touch-action:none}
#menu{z-index:3}
#fade{z-index:9;background:#000;opacity:0;transition:opacity .45s ease}
#fade.on{opacity:1}
#nogl{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:var(--bg);text-align:center}
#nogl div{max-width:520px;background:var(--paper);color:var(--paperInk);padding:22px 26px;font-family:var(--type);font-size:18px;line-height:1.45}
#nogl h2{color:var(--red);margin-bottom:10px;font-size:30px}
.stencil{font-family:var(--stencil);text-transform:uppercase;letter-spacing:.05em}
.type{font-family:var(--type)}
.panel{background:var(--glass);border-left:4px solid var(--khaki)}

/* ---------- Glifos de controles ---------- */
kbd{display:inline-grid;place-items:center;min-width:1.6em;height:1.55em;padding:0 .4em;margin:0 .08em;font:700 .82em/1 var(--cond);color:#1d1e16;background:#ece6d3;
  border-radius:4px;box-shadow:inset 0 -3px 0 #a9a28a;text-transform:uppercase;letter-spacing:.02em;vertical-align:.08em;text-shadow:none}
.pg{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .3em;border-radius:50%;font:800 .78em/1 var(--cond);font-style:normal;color:#fff;background:#3b3f33;
  vertical-align:.06em;margin:0 .08em;text-shadow:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.pg.b0{background:#3f8a3a}.pg.b1{background:#b2382d}.pg.b2{background:#2f62b0}.pg.b3{background:#c39a24;color:#1d1e16}
.pg.sh,.pg.tr{border-radius:6px;min-width:2.2em;background:#2c2f26}.pg.tr{border-radius:6px 6px 10px 10px}.pg.st,.pg.dp,.pg.sm{border-radius:6px;background:#2c2f26}
.tg{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;border:2px solid rgba(194,178,128,.75);background:rgba(22,26,15,.6);vertical-align:-.45em;margin:0 .15em;color:#e8e1cc}
.tg svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tg.fire{border-color:rgba(232,140,110,.8);background:rgba(110,30,22,.6)}

/* =================================== HUD =================================== */
#hud .h{position:absolute}
#hud svg.hi{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
/* visor del fusil de francotirador (la máscara circular la pone Post) */
#hud .scope{inset:0}
#hud .scope svg{position:absolute;left:50%;top:50%;width:calc(var(--R,200px)*2);height:calc(var(--R,200px)*2);transform:translate(-50%,-50%);fill:#0a0a08;opacity:.92}
/* retícula */
#hud .xh{left:50%;top:50%;width:0;height:0;--g:10px;transition:opacity .12s}
#hud .xh.off{opacity:0}
#hud .xh i{position:absolute;background:rgba(244,240,226,.94);box-shadow:0 0 0 1px rgba(0,0,0,.4);transition:background .1s}
#hud .xh .u,#hud .xh .d{width:2px;height:11px;left:-1px}
#hud .xh .u{top:calc(-11px - var(--g))}#hud .xh .d{top:var(--g)}
#hud .xh .l,#hud .xh .r{height:2px;width:11px;top:-1px}
#hud .xh .l{left:calc(-11px - var(--g))}#hud .xh .r{left:var(--g)}
#hud .xh .c{width:2px;height:2px;left:-1px;top:-1px;opacity:.75}
#hud .xh.en i{background:#ff6a50}
#hud .frn{left:50%;top:calc(50% + 26px);transform:translateX(-50%);font:700 14px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:#a9d47c;opacity:0;transition:opacity .15s}
#hud .frn.on{opacity:1}
/* marcador de impacto / baja */
#hud .hm{left:50%;top:50%;width:0;height:0;opacity:0}
#hud .hm i{position:absolute;left:-1px;top:-5px;width:2px;height:10px;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.9)}
#hud .hm.k i{background:#ff4a32;height:13px;top:-6.5px;width:3px;left:-1.5px}
#hud .hm.hs i{height:17px;top:-8.5px}
/* indicadores de daño (arcos alrededor del centro) */
#hud .dm{left:50%;top:50%;width:0;height:0;--dr:min(21vh,21vw)}
#hud .dm i{position:absolute;left:-70px;width:140px;height:38px;top:calc(-1*var(--dr) - 38px);transform-origin:70px calc(38px + var(--dr));opacity:0}
#hud .dm svg{width:100%;height:100%;fill:rgba(205,32,20,.92);filter:drop-shadow(0 0 6px rgba(200,20,10,.85))}
/* granada cerca */
#hud .gws{left:50%;top:50%;width:0;height:0}
#hud .gw{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .15s}
#hud .gw.on{opacity:1}
#hud .gw .gi{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(150,26,18,.82);border:2px solid #ffb39f;color:#fff;font-size:22px;animation:gwp .7s infinite}
#hud .gw.near .gi{animation-duration:.32s;background:rgba(200,30,18,.95)}
#hud .gw .ga{position:absolute;left:-30px;top:-30px;width:60px;height:60px}
#hud .gw .ga svg{position:absolute;left:21px;top:-8px;width:18px;height:18px;fill:#ff8a70;filter:drop-shadow(0 0 2px #000)}
@keyframes gwp{50%{transform:scale(1.12)}}
/* brújula */
#hud .cmp{left:50%;top:calc(var(--sat) + 6px);transform:translateX(-50%)}
#hud .cmp canvas{display:block}
#hud .tmr{left:50%;top:calc(var(--sat) + 54px);transform:translateX(-50%);font:700 24px var(--cond);letter-spacing:.06em;color:#f0d9a0;font-variant-numeric:tabular-nums}
#hud .tmr.low{color:#ff7a5c;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
#hud .toast{left:50%;top:calc(var(--sat) + 62px);display:flex;align-items:center;gap:8px;padding:5px 16px 5px 12px;background:linear-gradient(90deg,rgba(14,16,10,0),rgba(14,16,10,.72) 18%,rgba(14,16,10,.72) 82%,rgba(14,16,10,0));
  font:400 15px var(--stencil);letter-spacing:.16em;text-transform:uppercase;color:#e9dfb9;opacity:0;transform:translate(-50%,-8px);transition:opacity .35s,transform .35s;white-space:nowrap}
#hud .toast svg{width:18px;height:18px;fill:none;stroke:var(--brass);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hud .toast.on{opacity:1;transform:translate(-50%,0)}
/* objetivo */
#hud .obj{left:calc(var(--sal) + 16px);top:calc(var(--sat) + 14px);max-width:min(380px,34vw);padding:7px 14px 9px 12px;background:linear-gradient(90deg,rgba(14,16,10,.74),rgba(14,16,10,.38));border-left:3px solid var(--brass);transition:background .4s}
#hud .obj .lb{display:flex;align-items:center;gap:6px;font:400 12px var(--stencil);letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:2px}
#hud .obj .lb svg{fill:var(--brass);stroke:none;width:13px;height:13px}
#hud .obj .tx{font:600 clamp(15px,2.2vmin,19px)/1.22 var(--cond);letter-spacing:.01em}
#hud .obj.new{background:linear-gradient(90deg,rgba(150,112,30,.62),rgba(14,16,10,.38));animation:objIn .5s}
@keyframes objIn{from{transform:translateX(-14px)}}
/* supervivencia */
#hud .surv{right:calc(var(--sar) + 20px);top:calc(var(--sat) + 14px);display:flex;gap:10px;align-items:stretch}
#hud .surv>div{padding:5px 14px 6px;background:rgba(14,16,10,.66);border-top:3px solid var(--brass);text-align:center;min-width:76px}
#hud .surv small{display:block;font:400 11px var(--stencil);letter-spacing:.18em;text-transform:uppercase;color:var(--khaki)}
#hud .surv b{font:800 28px/1 var(--cond);font-variant-numeric:tabular-nums}
#hud .surv .pops{position:absolute;right:0;top:100%;display:flex;flex-direction:column;align-items:flex-end;padding:0;background:none;border:0;min-width:0}
#hud .surv .pops span{font:800 20px var(--cond);color:#f2d27a;animation:pop 1.3s forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}to{opacity:0;transform:translateY(-14px)}}
/* munición */
#hud .amm{right:calc(var(--sar) + 22px);bottom:calc(var(--sab) + 18px);display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
#hud .amm .wn{display:flex;align-items:center;gap:8px;font:700 15px var(--cond);letter-spacing:.14em;text-transform:uppercase}
#hud .amm .md{font:700 11px var(--cond);letter-spacing:.12em;padding:1px 6px;border:1px solid rgba(194,178,128,.6);color:var(--khaki)}
#hud .amm .cnt{display:flex;align-items:baseline;gap:6px;line-height:.9}
#hud .amm .mag{font:800 clamp(38px,6vmin,54px)/.9 var(--cond);font-variant-numeric:tabular-nums}
#hud .amm .res{font:600 clamp(18px,2.8vmin,24px) var(--cond);opacity:.78;font-variant-numeric:tabular-nums}
#hud .amm.low .mag{color:#f0a060}#hud .amm.empty .mag{color:#ff5a44}
#hud .amm .bul{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
#hud .amm .heat{width:150px;height:6px;background:rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(194,178,128,.4)}
#hud .amm .heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a03a,#ff6a3a)}
#hud .amm.hot .heat i{background:#ff3a20;animation:blink .4s steps(2) infinite}
#hud .amm .eq{display:flex;align-items:center;gap:12px;margin-top:2px}
#hud .amm .gr{display:flex;align-items:center;gap:1px;color:#b8c28a;font:700 15px var(--cond)}
#hud .amm .gr svg{width:19px;height:19px;fill:rgba(90,104,60,.85);stroke:#d6d9b8;stroke-width:1.4}
#hud .amm .gr.stiel svg{fill:rgba(90,90,84,.85)}
#hud .amm .gr.none svg{opacity:.3}
#hud .amm .stn svg{width:24px;height:24px;fill:none;stroke:#e8e1cc;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hud .amm .st{font:700 13px var(--cond);letter-spacing:.14em;text-transform:uppercase;min-height:1px}
#hud .amm .st.r{color:var(--khaki)}#hud .amm .st.n,#hud .amm .st.h{color:#ff6a50}#hud .amm .st.l{color:#f0b070}
/* usar / recoger */
#hud .pr{left:50%;top:calc(50% + 62px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 16px 7px;background:rgba(10,12,8,.62);
  font:600 clamp(16px,2.3vmin,19px) var(--cond);letter-spacing:.02em;white-space:nowrap;border-bottom:2px solid rgba(201,160,58,.6)}
#hud .pr .bar{width:190px;height:5px;background:rgba(0,0,0,.6)}#hud .pr .bar i{display:block;height:100%;width:0;background:var(--brass)}
/* avisos centrados */
#hud .msg{left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .45s;width:max-content;max-width:90vw}
#hud .msg .t span{white-space:nowrap}
#hud .msg.on{opacity:1;animation:msgIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes msgIn{from{transform:translate(-50%,10px) scale(.97)}}
#hud .msg .t{display:flex;align-items:center;justify-content:center;gap:10px;font:400 clamp(22px,3.8vmin,34px) var(--stencil);letter-spacing:.16em;text-transform:uppercase}
#hud .msg .t svg{width:.9em;height:.9em}
#hud .msg .s{font:600 clamp(16px,2.5vmin,22px)/1.3 var(--cond);margin-top:3px}
#hud .msg.obj .t{color:#f0cb6a}#hud .msg.obj .t svg{fill:#f0cb6a;stroke:none}
#hud .msg.done .t{color:#b8dc8a}
#hud .msg.hint .s{display:inline-block;padding:6px 16px;background:rgba(10,12,8,.6);border-left:3px solid var(--brass)}
#hud .msg.wave .s{font:400 clamp(30px,6vmin,52px) var(--stencil);letter-spacing:.14em;text-transform:uppercase;color:#f0cb6a}
/* subtítulos */
#hud .sub{left:50%;bottom:calc(var(--sab) + 13%);transform:translateX(-50%);width:min(820px,80vw);display:flex;flex-direction:column;align-items:center;gap:4px}
#hud .sub p{margin:0;padding:3px 12px 4px;background:rgba(8,9,6,.66);font:500 clamp(16px,2.4vmin,21px)/1.35 var(--cond);text-align:center;animation:subIn .25s}
#hud .sub b{margin-right:7px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#hud .sub p.de{font-style:italic;color:#f2d3c8;border-left:3px solid #9a3a2c}
body[data-sub="s"] #hud .sub p{font-size:clamp(14px,2vmin,17px)}body[data-sub="l"] #hud .sub p{font-size:clamp(20px,3vmin,27px)}
@keyframes subIn{from{transform:translateY(4px)}}
/* cartel de inicio de misión */
#hud .ban{left:calc(var(--sal) + 32px);bottom:calc(var(--sab) + 13% + 150px);display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .9s;max-width:70vw}
#hud .ban.on{opacity:1}
#hud .ban b{font:400 clamp(28px,5vmin,46px)/1 var(--stencil);letter-spacing:.07em;text-transform:uppercase;color:#f2ecd8;padding-bottom:6px;border-bottom:3px solid var(--brass);margin-bottom:6px;width:max-content;max-width:100%}
#hud .ban span{font:400 clamp(16px,2.5vmin,21px) var(--type);color:#e3d9b8;min-height:1.3em}
/* estrella del objetivo en el mundo */
#hud .mk{left:0;top:0;width:0;height:0;transition:opacity .2s}
#hud .mk svg{position:absolute;left:-11px;top:-11px;width:22px;height:22px;fill:#e0b13c;stroke:rgba(20,16,8,.85);stroke-width:1.3;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
#hud .mk b{position:absolute;left:-40px;top:12px;width:80px;text-align:center;font:700 13px var(--cond)}
#hud .mk.dim{opacity:.35}
/* pantalla de muerte */
#hud .dead{inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(40,0,0,.1),rgba(18,0,0,.72));opacity:0;transition:opacity 1.2s;pointer-events:none}
#hud .dead.on{opacity:1}
#hud.isdead :is(.msg,.ban,.toast,.pr,.xh,.frn,.mk,.gws,.sub,.hm){opacity:0!important;transition:opacity .4s}
#hud .dead .dc{max-width:min(620px,92vw)}
#hud .dead h2{font-size:clamp(44px,9vmin,84px);letter-spacing:.16em;color:#efe2d0;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 30px rgba(120,0,0,.6)}
#hud .dead .why{font:600 20px var(--cond);margin:6px 0 0;color:#f0b8a0}
#hud .dead .svr{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0 0}
#hud .dead .svr span{padding:6px 14px;background:rgba(10,10,8,.6);border-top:3px solid var(--brass);min-width:96px}
#hud .dead .svr small{display:block;font:400 11px var(--stencil);letter-spacing:.16em;text-transform:uppercase;color:var(--khaki)}
#hud .dead .svr b{font:800 28px var(--cond)}
#hud .dead .svr em{flex-basis:100%;font:400 18px var(--stencil);letter-spacing:.14em;color:#f0cb6a;font-style:normal;text-transform:uppercase}
#hud .dead .tipc{margin:22px auto 0;max-width:520px;padding:12px 18px 14px;background:var(--paper);color:var(--paperInk);text-align:left;transform:rotate(-.6deg);box-shadow:0 8px 30px rgba(0,0,0,.5);text-shadow:none}
#hud .dead .tl{font:400 13px var(--stencil);letter-spacing:.2em;text-transform:uppercase;color:#8e2f2a}
#hud .dead .tip{margin:4px 0 0;font:400 17px/1.45 var(--type)}
#hud .dead .hint{margin:22px 0 0;font:600 18px var(--cond);letter-spacing:.04em;animation:blink 1.6s ease-in-out infinite}
/* táctil: el HUD se aparta de los botones */
body.touch #hud .amm{bottom:auto;top:calc(var(--sat) + 70px*var(--ts) + 6px);right:calc(var(--sar) + 18px)}
body.touch #hud .amm .eq{display:none}
body.touch #hud .surv{right:auto;left:calc(var(--sal) + 16px);top:calc(var(--sat) + 96px)}
body.touch #hud .sub{left:39%;width:min(520px,46vw);bottom:calc(var(--sab) + 18px)}
body.touch #hud .ban{bottom:auto;top:30%}
body.touch #hud .msg{top:14%}
body.touch #hud .pr{top:calc(50% + 54px)}
@media (orientation:portrait){
  #hud .obj{max-width:min(360px,52vw)}
  body.touch #hud .sub{left:50%;width:min(620px,88vw);bottom:auto;top:calc(var(--sat) + 192px)}
  body.touch #hud .msg{top:28%}body.touch #hud .ban{top:40%}
  body.touch #hud .surv{top:calc(var(--sat) + 110px)}
}
@media (max-height:480px){
  #hud .cmp{top:calc(var(--sat) + 2px)}#hud .obj{top:calc(var(--sat) + 8px);padding:5px 10px 6px}#hud .obj .tx{font-size:14px}
  #hud .amm .mag{font-size:34px}#hud .msg{top:18%}
}

/* =================================== Táctil =================================== */
#touch .tz{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#touch .tb{position:absolute;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(46,52,32,.62),rgba(16,19,11,.62));
  border:2px solid rgba(194,178,128,.66);color:#ebe4cf;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 3px rgba(0,0,0,.2);pointer-events:none;transition:background .08s,transform .08s,border-color .15s}
#touch .tb svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
#touch .tb.on{background:rgba(201,160,58,.62);transform:scale(.93);border-color:#f0d896}

#touch .tb.fire.tgt{border-color:#ffd25a;box-shadow:0 0 0 4px rgba(255,210,90,.4)}
#touch .tb .bd{position:absolute;right:-4px;top:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:grid;place-items:center;font:800 13px var(--cond);background:#e8e1cc;color:#1d1e16;box-shadow:0 1px 3px rgba(0,0,0,.6)}
#touch .tb.empty{opacity:.45!important}
#touch .tb.use{border-color:#f0d896;background:radial-gradient(circle at 50% 38%,rgba(120,96,30,.7),rgba(60,48,14,.7));animation:useIn .25s}
#touch .tb.use .ul{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);padding:4px 10px;background:rgba(14,16,10,.72);font:700 15px var(--cond);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 2px #000;border-left:3px solid var(--brass)}
@keyframes useIn{from{transform:scale(.6);opacity:0}}
#touch .tb.pause{border-radius:12px}
#touch .stk{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(194,178,128,.5);background:radial-gradient(circle,rgba(22,26,15,.12),rgba(22,26,15,.4));pointer-events:none;transition:opacity .2s}
#touch .stk i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(circle at 45% 35%,rgba(240,234,214,.75),rgba(180,170,140,.55));border:2px solid rgba(255,255,255,.45);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#touch .stk b{position:absolute;left:50%;top:-16px;width:0;height:0;border:7px solid transparent;border-bottom-color:rgba(201,160,58,.0);margin-left:-7px;transition:border-color .15s}
#touch .stk.sp{border-color:rgba(201,160,58,.95)}#touch .stk.sp b{border-bottom-color:rgba(201,160,58,.95)}

/* =================================== Menús =================================== */

.scr-title .cont{position:absolute;right:calc(var(--sar) + 30px);bottom:calc(var(--sab) + 64px);width:min(330px,34vw);display:flex;flex-direction:column;background:rgba(14,16,10,.82);border-top:4px solid var(--brass);text-align:left;transition:transform .15s}
